name: Sync Daejeon Jung-gu restaurants
on:
  workflow_dispatch:
  schedule:
    - cron: '20 18 * * 0'
permissions:
  contents: write
concurrency:
  group: sync-restaurants
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch restaurant data
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PAGE_SIZE: '1000'
          MAX_PAGES: '10000'
          REQUEST_DELAY_MS: '180'
        run: node server/sync.mjs
      - name: Commit changed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/restaurants.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Jung-gu restaurants"
            git push
          else
            echo "No changes"
          fi
